# The public booking form moved to the marketing site. Old /intake links, ads and
# bookmarks land on the new page (query strings such as ?source= and utm_* carry over).
[[redirects]]
  from = "/intake"
  to = "https://sdfmgroup.com/book"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# First-party website tracker, loaded by sdfmgroup.com and the intake form.
# Short cache so tracker fixes reach visitors within the hour.
[[headers]]
  for = "/sdfm-tracker.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=3600"
