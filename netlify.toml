# Claude connector (bms-mcp): the MCP and OAuth endpoints live on the BMS
# domain and are proxied to the Edge Function. /oauth/authorize is an app page.
[[redirects]]
  from = "/mcp"
  to = "https://kvlietqeafjtwojkqnqa.supabase.co/functions/v1/bms-mcp/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/register"
  to = "https://kvlietqeafjtwojkqnqa.supabase.co/functions/v1/bms-mcp/oauth/register"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/token"
  to = "https://kvlietqeafjtwojkqnqa.supabase.co/functions/v1/bms-mcp/oauth/token"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/revoke"
  to = "https://kvlietqeafjtwojkqnqa.supabase.co/functions/v1/bms-mcp/oauth/revoke"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource/*"
  to = "https://kvlietqeafjtwojkqnqa.supabase.co/functions/v1/bms-mcp/.well-known/oauth-protected-resource"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "https://kvlietqeafjtwojkqnqa.supabase.co/functions/v1/bms-mcp/.well-known/oauth-protected-resource"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-authorization-server/*"
  to = "https://kvlietqeafjtwojkqnqa.supabase.co/functions/v1/bms-mcp/.well-known/oauth-authorization-server"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "https://kvlietqeafjtwojkqnqa.supabase.co/functions/v1/bms-mcp/.well-known/oauth-authorization-server"
  status = 200
  force = true

# The booking form is retired. Old /intake links, ads and
# bookmarks land on the assessment page (query strings such as ?source= and utm_* carry over).
[[redirects]]
  from = "/intake"
  to = "https://sdfmgroup.com/ai-gap-check"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# First-party website tracker, loaded by sdfmgroup.com and the intake form.
# Short cache so tracker fixes reach visitors within the hour.
[[headers]]
  for = "/sdfm-tracker.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=3600"
